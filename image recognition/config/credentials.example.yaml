# DSH 凭据库示例 —— 复制为 ~/.dsh/.credentials.yaml 后填入真实 Key
# （切勿把真实 Key 提交到 GitHub）

# DeepSeek 主模型（已有则保留）
DEEPSEEK_API_KEY: sk-xxxxxxxxxxxxxxxx

# 智谱 GLM 主通道（glm-4.6v-flash，免费）
ZHIPU_API_KEY: 你的智谱APIKey.id.secret

# 智谱 GLM 第二通道（glm-4.1v-thinking-flash，免费；双模型综合分析用）
ZHIPU_API_KEY_2: 你的第二个智谱APIKey.id.secret

# Gemini（可选，国内访问需代理）
# GEMINI_API_KEY: AIza...
